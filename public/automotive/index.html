/* Customer record: compact contextual actions beside the customer name. */
.customer-identity{min-width:0;flex:1}
.customer-name-actions{display:flex;align-items:center;flex-wrap:wrap;column-gap:12px;row-gap:8px}
.customer-name-actions h1{overflow-wrap:anywhere}
.customer-quick-actions{display:inline-flex;gap:8px;align-items:center;flex:none}
.customer-icon-action{width:44px;height:44px;min-width:44px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--accent);display:inline-grid;place-items:center;transition:background 80ms ease,border-color 80ms ease,transform 80ms ease;box-shadow:0 1px 2px #101d3007}
.customer-icon-action svg{width:19px;height:19px;pointer-events:none}
.customer-icon-action:hover{background:var(--accent2);border-color:#aac7ff}
.customer-icon-action:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.customer-icon-action:active{transform:scale(.96)}
@media(max-width:760px){.customer-page-head{align-items:flex-start}.customer-name-actions{column-gap:10px}.customer-quick-actions{gap:8px}.customer-icon-action{width:44px;height:44px;min-width:44px}.customer-page-head>.btn{flex:none}}
@media(prefers-reduced-motion:reduce){.customer-icon-action{transition:none}}

/* Customer > Vehicle > Repair Order: dedicated, selectable records. */
.record-breadcrumbs{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 18px;font-size:13px;color:var(--muted)}
.record-breadcrumbs button{border:0;background:transparent;color:#245cc8;font-weight:700;padding:7px 3px;border-radius:5px;min-height:36px}
.record-breadcrumbs button:hover{text-decoration:underline}
.record-breadcrumbs button:focus-visible,.vehicle-entry:focus-visible,.vehicle-ro-open:focus-visible{outline:3px solid #6797f7;outline-offset:3px}
.vehicle-list{display:flex;flex-direction:column;gap:9px}
.vehicle-entry{width:100%;display:flex;align-items:center;text-align:left;gap:14px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 15px;min-height:76px;color:var(--ink)}
.vehicle-entry:hover{border-color:#8bacf4;background:#f7faff}
.vehicle-entry .vehicle-list-detail{flex:1;min-width:0}
.vehicle-entry .primarytext,.vehicle-entry .secondarytext{white-space:normal;overflow-wrap:anywhere}
.vehicle-entry svg{width:19px;height:19px}
.vehicle-entry .vehicle-arrow{font-size:20px;color:var(--accent)}
.vehicle-identity-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.vehicle-meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.vehicle-meta-grid>div{padding:14px;background:#f9fbfe;border:1px solid var(--border);border-radius:10px;overflow-wrap:anywhere}
.vehicle-meta-grid .tag{display:block;margin-bottom:5px}
.vehicle-ro-entry{display:flex;align-items:center;gap:14px;padding:17px 0;border-bottom:1px solid var(--border)}
.vehicle-ro-entry:last-child{border-bottom:0}
.vehicle-ro-entry .vehicle-ro-main{flex:1;min-width:0}
.vehicle-ro-entry .primarytext{font-size:15px}
.vehicle-ro-entry .secondarytext{overflow-wrap:anywhere;white-space:normal}
.vehicle-ro-open{flex:none;min-width:85px}
.vehicle-ro-filters{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:760px){.vehicle-identity-head{flex-wrap:wrap}.vehicle-meta-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.vehicle-ro-entry{align-items:flex-start;flex-wrap:wrap}.vehicle-ro-open{margin-left:auto}.vehicle-entry{min-height:76px}.record-breadcrumbs{margin-bottom:10px}}
/* Customer-facing link preview: intentionally isolated from the shop workspace. */
body.customer-mode{background:#f5f7fb;color:#192c42;font-size:16px}
.cp-demo-bar{background:#152840;color:#e9f0fb;min-height:48px;display:flex;gap:16px;align-items:center;justify-content:space-between;padding:8px max(20px,calc((100vw - 1180px)/2));font-size:12px}
.cp-demo-bar strong{font-size:10px;letter-spacing:1.1px;color:#a9ceff}
.cp-demo-bar button{border:1px solid #4b6485;border-radius:8px;background:#233d5c;color:white;padding:8px 13px;font-size:12px;font-weight:750;min-height:36px;white-space:nowrap}
.cp-demo-bar button:hover{background:#385777}
.cp-top{background:white;border-bottom:1px solid #e2e8f0}
.cp-top-inner{max-width:1180px;margin:auto;padding:18px 20px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.cp-brand{display:flex;align-items:center;gap:12px}
.cp-brand-mark{height:42px;width:42px;background:#2163ec;color:white;border-radius:12px;font-size:21px;font-weight:900;display:grid;place-items:center}
.cp-brand-name{font-size:18px;line-height:1.2;font-weight:800;letter-spacing:-.5px}
.cp-brand-sub{font-size:12px;color:#687b90;margin-top:3px}
.cp-helpline{font-size:12px;color:#5c6d81;text-align:right}
.cp-helpline b{display:block;color:#213c60;font-size:14px}

function roDetail(){const r=roBy(ui.selectedRo);if(!r||!canSeeRo(r))return '<div class="empty">Not authorized to view this repair order.</div>';let action=roAction(r);const steps=STAGES.map(([key,label],i)=>`<div class="stage-node ${stageIndex(r)>i?'done':stageIndex(r)===i?'current':''}"><span class="dot">${stageIndex(r)>i?'✓':i+1}</span>${label}</div>`).join('');let tabs=isTech()?['overview','inspection','work','activity']:['overview','inspection','estimate','proposal','work','invoice','payment','documents','activity'];if(ui.tab==='invoice'&&r.stage==='inspection')ui.tab='overview';return `<nav class="record-breadcrumbs" aria-label="Record location">${isTech()?`<button onclick="changePage('jobs')">My repair orders</button><span>›</span><strong>${esc(r.num)}</strong>`:ui.roReturnVehicle===r.vehicle?`<button onclick="openCustomer('${r.customer}')">${esc(customer(r.customer).name)}</button><span>›</span><button onclick="openVehicle('${r.vehicle}')">${esc(car(vehicle(r.vehicle)))}</button><span>›</span><strong>${esc(r.num)}</strong>`:`<button onclick="changePage('jobs')">Repair orders</button><span>›</span><button onclick="openCustomer('${r.customer}')">${esc(customer(r.customer).name)}</button><span>›</span><strong>${esc(r.num)}</strong>`}</nav><div class="card ro-header"><div class="ro-headerline"><div><div class="eyebrow">${esc(r.num)} · ${esc(customer(r.customer).name)}</div><h1>${esc(car(vehicle(r.vehicle)))}</h1><p class="sub">${esc(r.concern)}</p></div><div class="btnrow">${stagePill(r)}${advisor()&&r.lines.length?`<button class="btn small" onclick="openCustomerPreview('${r.id}')">↗ Customer view</button>`:''}${manager()?`<button class="btn small" onclick="openModal('assignRo',{id:'${r.id}'})">Manage team</button>`:''}</div></div><div class="meta-strip"><span>RO <b>${esc(r.num)}</b></span><span>Mileage <b>${Number(r.mileage||0).toLocaleString()} mi</b></span><span>Advisor <b>${esc(staff(r.advisor).name)}</b></span><span>Technician <b>${esc(staff(r.tech).name)}</b></span></div></div><div class="card workflow"><div class="stage-track">${steps}</div><div class="now"><div><div class="eyebrow">CURRENT STEP</div><h3>${esc(stageLabel[r.stage])}</h3><p>${esc(nextAction(r))}</p></div>${r.stage!=='closed'&&!(isTech()&&!['inspection','repair'].includes(r.stage))?`<button class="btn primary" onclick="goTab('${isTech()?(r.stage==='inspection'?'inspection':'work'):(r.stage==='intake'?'overview':r.stage==='approval'?'proposal':r.stage)}');${r.stage==='intake'?`openModal('assignRo',{id:'${r.id}'})`:''}">${esc(action[0])} →</button>`:r.stage==='closed'?pill('Completed','green'):''}</div></div><div class="card card-pad"><div id="ro-detail-tabs" class="tabbar">${tabs.map(t=>`<button class="tab ${ui.tab===t?'active':''}" onclick="goTab('${t}')">${({overview:'Overview',inspection:'Inspection',estimate:'Price work',proposal:'Review & send',work:'Repairs',invoice:'Invoice',payment:'Payment',documents:'Documents',activity:'History'})[t]}</button>`).join('')}</div>${({overview:()=>roOverview(r),inspection:()=>roInspection(r),estimate:()=>roEstimate(r),proposal:()=>roProposal(r),work:()=>roWork(r),invoice:()=>roInvoice(r),payment:()=>roPayment(r),documents:()=>roDocuments(r),activity:()=>roHistory(r)})[ui.tab]?.()||roOverview(r)}</div>`}
function roOverview(r){return `<div class="grid two"><div class="stack"><div class="callout"><div class="eyebrow">VEHICLE & CONCERNS</div><h2 style="margin-bottom:8px">${esc(car(vehicle(r.vehicle)))}</h2><p>${esc(r.concern)}</p><div class="meta-strip"><span>VIN: <b>${esc(vehicle(r.vehicle).vin||'Not entered')}</b></span><span>Plate: <b>${esc(vehicle(r.vehicle).plate||'—')}</b></span></div></div><div class="section-head" style="margin-top:8px"><h2>Work in progress</h2><span class="pill">${r.lines.length} recommended service(s)</span></div>${r.lines.length?r.lines.map(l=>`<div class="item"><div class="iconbox">${l.decision==='approved'?'✓':'○'}</div><div class="item-main"><div class="primarytext">${esc(l.name)}</div><div class="secondarytext">${money(Number(l.parts)+Number(l.labor))} · ${l.decision==='approved'?'Customer approved':l.decision==='declined'?'Customer declined':'Waiting for decision'}</div></div>${pill(l.decision||'Pending',l.decision==='approved'?'green':l.decision==='declined'?'red':'amber')}</div>`).join(''):'<div class="notice">Repair recommendations will appear here after technician inspection.</div>'}<div class="callout"><h3>Customer authorization</h3><p class="sub">${r.authorized?`Signed by ${esc(r.signedBy||customer(r.customer).name)} · ${esc(r.authorized)}. Only approved work may proceed.`:r.estimateSent?'Proposal sent, customer signature still required.':'Not yet sent to customer.'}</p>${r.authorized?pill('Signed authorization on file','green'):pill(r.estimateSent?'Awaiting customer':'Not sent','amber')}</div></div><div class="stack"><div class="callout"><div class="section-head"><h2>Assignment</h2>${manager()?`<button class="btn small" onclick="openModal('assignRo',{id:'${r.id}'})">Change</button>`:''}</div><div class="metricrow"><span>Service advisor</span><b>${esc(staff(r.advisor).name)}</b></div><div class="metricrow"><span>Technician</span><b>${esc(staff(r.tech).name)}</b></div></div><div class="callout"><h2>Latest activity</h2><ol class="activity" style="margin-top:18px">${r.history.slice(0,5).map(h=>`<li><b>${esc(h.text)}</b><time>${esc(h.at)} · ${esc(h.by)}</time></li>`).join('')}</ol><button class="btn small full" style="margin-top:17px" onclick="goTab('activity')">View complete history</button></div></div></div>`}
function roInspection(r){const editable=isTech()||manager();return `<div class="section-head"><div><h2>Technician inspection</h2><p class="sub">Inspection results belong to this RO. The advisor is notified on submission.</p></div>${r.inspection.length?pill('Inspection recorded','green'):pill('Inspection pending','amber')}</div>${r.inspection.length?`<div class="stack">${r.inspection.map(i=>`<div class="item"><span class="iconbox">${i.result==='good'?'✓':'!'}</span><div class="item-main"><div class="primarytext">${esc(i.name)}</div><div class="secondarytext">${esc(i.note||'No notes')}</div></div>${pill(i.result==='good'?'Good':'Needs attention',i.result==='good'?'green':'amber')}</div>`).join('')}</div>`:`<div class="notice">${r.tech?'Assigned to '+esc(staff(r.tech).name)+'.':'Assign a technician before inspection.'} Record findings directly in this workspace.</div>`}${editable&&r.stage==='inspection'?`<div class="action-panel" style="margin-top:17px"><h3>Record inspection results</h3><p class="sub">Add an inspection finding. You can repeat this for each component that matters.</p><form onsubmit="event.preventDefault();submitInspection(this,'${r.id}')" class="formgrid" style="margin-top:14px"><label>Component / system<input name="name" placeholder="e.g. Engine diagnostics" required></label><label>Result<select name="result"><option value="good">Good</option><option value="attention">Needs attention</option></select></label><label class="span">Finding / recommendation<textarea name="note" placeholder="What did you find?" required></textarea></label><div class="span btnrow"><button class="btn" type="submit">+ Add inspection finding</button><button type="button" class="btn primary" ${!r.inspection.length?'disabled':''} onclick="submitInspectionComplete('${r.id}')">Submit inspection → Notify advisor</button></div></form></div>`:''}${r.stage==='estimate'&&r.inspection.length?'<p class="notice good" style="margin-top:16px">Inspection complete. Advisor can now price recommendations.</p>':''}`}
function roEstimate(r){if(!advisor())return '<div class="notice">Technicians do not have access to customer pricing.</div>';if(!['estimate','approval'].includes(r.stage))return `<div class="notice">${r.stage==='inspection'?'Technician inspection is still in progress. Pricing opens after inspection.':r.stage==='repair'?'Work is already authorized. New repair recommendations require a fresh customer authorization.':'This RO is past the pricing stage. Previous estimate versions are kept in Documents.'}</div>${r.lines.length?estimateSummary(r):''}`;return `<div class="section-head"><div><h2>Build estimate</h2><p class="sub">Price individual repairs. Only customer-approved lines can be released to the technician.</p></div>${pill(r.lines.length+' line(s)')}</div>${r.lines.length?`<div class="stack">${r.lines.map(l=>`<div class="item"><div class="item-main"><div class="primarytext">${esc(l.name)}</div><div class="secondarytext">Parts ${money(l.parts)} · Labor ${money(l.labor)} · Shop cost ${money(l.cost)}</div></div><b>${money(Number(l.parts)+Number(l.labor))}</b>${r.stage==='estimate'?`<button class="btn small danger" onclick="removeLine('${r.id}','${l.id}')">Remove</button>`:''}</div>`).join('')}</div><hr class="divider"><div class="row"><b>Estimate subtotal (all recommended work)</b><b>${money(r.lines.reduce((n,l)=>n+Number(l.parts)+Number(l.labor),0))}</b></div>`:''}${r.stage==='estimate'?`<div class="action-panel" style="margin-top:18px"><h3>Add repair recommendation</h3><form class="formgrid" style="margin-top:13px" onsubmit="event.preventDefault();addLine(this,'${r.id}')"><label class="span">Service / recommendation<input name="name" placeholder="e.g. Replace ignition coils" required></label><label>Parts selling price ($)<input name="parts" inputmode="decimal" type="number" min="0" step="0.01" value="0" required></label><label>Labor selling price ($)<input name="labor" inputmode="decimal" type="number" min="0" step="0.01" value="0" required></label><label>Internal parts + labor cost ($)<input name="cost" inputmode="decimal" type="number" min="0" step="0.01" value="0" required></label><div class="span btnrow"><button class="btn" type="submit">+ Add recommendation</button>${r.lines.length?`<button class="btn primary" type="button" onclick="goTab('proposal')">Review complete customer packet →</button>`:''}</div></form></div>`:''}`}
function estimateSummary(r){return `<div class="callout" style="margin-top:14px"><div class="row"><b>Saved customer estimate</b>${pill('Version '+(r.estimateVersion||1),'blue')}</div><div class="sub">${esc(r.lines.length)} recommendations · ${money(r.lines.reduce((n,l)=>n+Number(l.parts)+Number(l.labor),0))} before taxes or declines.</div></div>`}
function documentPreview(r,type='estimate'){const isInvoice=type==='invoice';const relevant=isInvoice?approvedLines(r):r.lines;const subtotalAmount=relevant.reduce((n,l)=>n+Number(l.parts)+Number(l.labor),0);const totalAmount=subtotalAmount*(1+tax());return `<div class="preview"><div class="dochead"><div><div class="eyebrow">${esc(data.business)}</div><h2>${isInvoice?'INVOICE':'SERVICE ESTIMATE'}</h2><div class="secondarytext">${esc(data.settings.address)}<br>${esc(data.settings.phone)}</div></div><div style="text-align:right"><strong>${isInvoice?'INV-':'EST-'}${esc(r.num.replace('RO-',''))}</strong><div class="secondarytext">${esc(customer(r.customer).name)}<br>${esc(car(vehicle(r.vehicle)))}</div></div></div><p class="sub" style="margin-bottom:12px">${isInvoice?'Customer-authorized, completed services':'Review every proposed repair before authorizing work'}</p>${relevant.map(l=>`<div class="docrow"><div><strong>${esc(l.name)}</strong><div class="secondarytext">Parts ${money(l.parts)} · Labor ${money(l.labor)} ${!isInvoice&&l.decision?`· ${esc(l.decision)}`:''}</div></div><b>${money(Number(l.parts)+Number(l.labor))}</b></div>`).join('')||'<div class="empty">Add priced recommendations before preparing the document.</div>'}<div style="margin-top:18px;max-width:270px;margin-left:auto"><div class="metricrow"><span>Subtotal</span><b>${money(subtotalAmount)}</b></div><div class="metricrow"><span>Tax (${Number(data.settings.tax)}%)</span><b>${money(subtotalAmount*tax())}</b></div><div class="row" style="padding-top:13px"><b>Total</b><div class="total">${money(totalAmount)}</div></div></div>${!isInvoice?`<hr class="divider"><p class="secondarytext">Customer must approve or decline each line and sign. Declined lines will not be billed. New work or revisions require fresh authorization.</p>`:'<p class="secondarytext" style="margin-top:15px">Payment is due upon completion of service. Thank you for your business.</p>'}</div>`}
function roProposal(r){if(isTech())return '<div class="notice">Estimate and customer communications are not available to technicians.</div>';if(!r.lines.length)return `<div class="empty"><h3>No priced recommendations yet</h3><p>Complete the inspection and price the work first.</p><button class="btn primary" style="margin-top:15px" onclick="goTab('estimate')">Build estimate</button></div>`;return `<div class="section-head"><div><h2>Review, finalize & send</h2><p class="sub">Review the same customer-facing document before you send it. No extra document tab required.</p></div>${pill(r.authorized?'Authorized':r.estimateSent?'Sent':'Draft',r.authorized?'green':r.estimateSent?'amber':'blue')}</div><div class="steps-mini"><span class="done">✓ Price</span><span class="${r.estimateSent?'done':'active'}">${r.estimateSent?'✓':'2'} Review packet</span><span class="${r.estimateSent?'done':''}">${r.estimateSent?'✓':'3'} Send</span><span class="${r.authorized?'done':'active'}">${r.authorized?'✓':'4'} Track approval</span></div><div class="grid two"><div>${documentPreview(r,'estimate')}</div><div class="stack"><div class="callout"><h3>Customer recipient</h3><div class="metricrow"><span>Name</span><b>${esc(customer(r.customer).name)}</b></div><div class="metricrow"><span>Email</span><b style="overflow-wrap:anywhere">${esc(customer(r.customer).email||'Missing')}</b></div><div class="metricrow"><span>Mobile</span><b>${esc(customer(r.customer).phone||'Missing')}</b></div></div><div class="callout"><h3>Supporting documents</h3><p class="sub">Inspection report · Authorization terms · Estimate v${r.estimateVersion||1}</p><p class="secondarytext" style="margin-top:10px">These travel with the proposal. Final approval requires a signed decision for every line.</p></div><button class="btn full" onclick="openCustomerPreview('${r.id}')">↗ Preview customer link & complete packet</button>${!r.estimateSent&&r.stage==='estimate'?`<button class="btn primary full" onclick="sendEstimate('${r.id}')">Finalize & send to customer →</button>`:''}${r.estimateSent?`<div class="notice ${r.authorized?'good':''}"><b>${r.authorized?'Customer approved the estimate':'Proposal sent · awaiting customer'}</b><br>${esc(r.authorized||r.estimateSent)}</div><p class="secondarytext">Use “Preview customer link & complete packet” above to review the full customer experience.</p>`:''}${r.stage==='estimate'&&r.estimateSent?`<button class="btn full" onclick="goTab('estimate')">Edit draft</button>`:''}</div></div>`}
function roWork(r){const permitted=isTech()||manager();return `<div class="section-head"><div><h2>Technician work</h2><p class="sub">Only customer-authorized recommendations are released to repair.</p></div>${r.workDone?pill('Work complete','green'):pill(r.stage==='repair'?'In progress':'Not yet released',r.stage==='repair'?'blue':'')}</div>${r.authorized?`<div class="notice good">Signed customer authorization recorded. Approved lines are ready for assigned technician ${esc(staff(r.tech).name)}.</div>`:'<div class="notice warn">No signed customer authorization yet. Repair work cannot be marked complete.</div>'}<div class="stack" style="margin-top:14px">${approvedLines(r).map(l=>`<div class="item"><span class="iconbox">${r.workDone?'✓':'⚙'}</span><div class="item-main"><b>${esc(l.name)}</b><p class="secondarytext">${r.workDone?'Completed':'Approved for repair'}</p></div>${pill(r.workDone?'Done':'Authorized',r.workDone?'green':'blue')}</div>`).join('')||'<p class="quiet">No approved lines.</p>'}</div>${r.stage==='repair'&&permitted?`<button class="btn primary" style="margin-top:17px" onclick="completeWork('${r.id}')">Mark approved work complete → Notify advisor</button>`:''}${r.stage==='invoice'||r.stage==='payment'?`<p class="notice good" style="margin-top:16px">Technician handoff complete. The advisor now owns invoicing and payment.</p>`:''}`}
function roInvoice(r){if(isTech())return '<div class="notice">Invoices are service advisor functions.</div>';return `<div class="section-head"><h2>Customer invoice</h2>${pill(r.invoiceSent?'Sent':'Not sent',r.invoiceSent?'green':'amber')}</div>${r.stage==='invoice'||r.invoiceSent?documentPreview(r,'invoice'):`<div class="notice warn">Invoice is locked until customer-authorized work is marked complete by the technician.</div>`}${r.stage==='invoice'?`<div class="action-panel" style="margin-top:16px"><h3>Finalize invoice</h3><p class="sub">Bill only approved, completed work. Customer will receive the secure payment link.</p><div class="row" style="margin-top:15px"><b>Invoice total</b><strong>${money(billTotal(r))}</strong></div><button class="btn primary full" style="margin-top:15px" onclick="sendInvoice('${r.id}')">Send invoice and payment link →</button></div>`:''}${r.invoiceSent?`<div class="notice good" style="margin-top:16px">Invoice sent ${esc(r.invoiceSent)} · Customer payment status: ${r.paid?'Paid':'Awaiting payment'}</div>`:''}`}
function roPayment(r){if(isTech())return '<div class="notice">Payments are not visible to technicians.</div>';return `<div class="section-head"><h2>Payment & receipt</h2>${pill(r.paid?'Paid in full':r.invoiceSent?'Awaiting payment':'Not invoiced',r.paid?'green':r.invoiceSent?'amber':'')}</div><div class="grid two"><div class="callout"><div class="kpi-label">AMOUNT DUE</div><div class="finance-head">${money(r.paid?0:billTotal(r))}</div><div class="metricrow"><span>Invoice</span><b>INV-${esc(r.num.replace('RO-',''))}</b></div><div class="metricrow"><span>Invoice sent</span><b>${esc(r.invoiceSent||'Not yet')}</b></div><div class="metricrow"><span>Payment status</span>${pill(r.paid?'Completed':r.invoiceSent?'Outstanding':'Pending',r.paid?'green':'amber')}</div>${r.paid?`<div class="metricrow"><span>Payment method</span><b>${esc(r.paymentMethod||'Card')}</b></div><div class="metricrow"><span>Receipt</span><b>REC-${esc(r.num.replace('RO-',''))}</b></div>`:''}</div><div class="callout"><h3>${r.paid?'Payment complete':'Collect customer payment'}</h3><p class="sub">${r.paid?'Paid and recorded. A customer receipt is available.':'For this prototype you can simulate a successful payment. No card is charged and no email is actually sent.'}</p>${r.stage==='payment'&&!r.paid?`<button class="btn primary full" style="margin-top:15px" onclick="openModal('collect',{id:'${r.id}'})">Record successful payment</button>`:''}${r.paid?`<button class="btn full" style="margin-top:14px" onclick="openModal('receipt',{id:'${r.id}'})">View customer receipt</button>`:''}${r.paid&&r.stage!=='closed'?`<button class="btn primary full" style="margin-top:9px" onclick="closeRo('${r.id}')">Release vehicle & close RO</button>`:''}</div></div>`}
function roDocuments(r){if(isTech())return '<div class="notice">Customer financial documents are not visible to technicians.</div>';const docs=[['Inspection report',r.inspection.length?'Complete':'Awaiting technician'],['Estimate v'+(r.estimateVersion||1),r.estimateSent?'Sent':'Draft'],['Signed authorization',r.authorized?'Signed':'Not signed'],['Invoice',r.invoiceSent?'Sent':'Not generated'],['Receipt',r.paid?'Issued':'Not issued']];return `<div class="section-head"><h2>Documents archive</h2><span class="pill">Always inside this RO</span></div><p class="sub" style="margin-bottom:12px">Document preparation and sending happens in the Review & send and Invoice steps. This tab is the archive.</p>${docs.map(([name,status],i)=>`<div class="item"><div class="iconbox">▤</div><div class="item-main"><b>${esc(name)}</b><div class="secondarytext">${esc(status)}</div></div>${pill(status,['Signed','Sent','Issued','Complete'].includes(status)?'green':'')}</div>`).join('')}`}
function roHistory(r){return `<div class="section-head"><h2>Complete RO timeline</h2><span class="pill">${r.history.length} events</span></div><ol class="activity" style="margin-top:24px">${r.history.map(h=>`<li><b>${esc(h.text)}</b><time>${esc(h.at)} · ${esc(h.by)}</time></li>`).join('')}</ol><div class="notice" style="margin-top:16px">Calls, messages, reassignment and document events are captured as prototype activity. Real phone SMS cannot be tracked automatically without a connected messaging provider.</div>`}
function tasks(){
  // Staff never query or render a team-wide task list. Team filters are manager-only.
  const inScope=t=>canViewTask(t)&&(!ui.taskCustomer||t.customer===ui.taskCustomer);
  const matchFilter=t=>!manager()||ui.taskFilter==='all'||(ui.taskFilter==='mine'?t.who===data.actor:t.role===ui.taskFilter);
  const current=activeTasks().filter(t=>inScope(t)&&matchFilter(t));
  const tasks=current;
  const history=data.tasks.filter(t=>t.source==='workflow'&&t.status==='done'&&inScope(t)&&matchFilter(t)).slice(-12).reverse();
  return `${pageHead(manager()?'Team tasks':'My tasks',manager()?'Only the assigned employee and shop management can see each task. Review work and reassign it when necessary.':'Only tasks assigned directly to you appear here. Completing the actual work automatically closes each task.')}${ui.taskCustomer?`<div class="notice" style="margin-bottom:14px">Showing workflow tasks for <b>${esc(customer(ui.taskCustomer).name)}</b>. <button class="btn small" onclick="ui.taskCustomer=null;render()">Clear customer filter</button></div>`:''}${manager()?`<div class="btnrow" style="margin-bottom:16px" aria-label="Manager task filters">${[['all','Team queue'],['mine','Assigned to me'],['advisor','Advisors'],['technician','Technicians']].map(([id,name])=>`<button class="btn small filterbtn ${ui.taskFilter===id?'active':''}" onclick="ui.taskFilter='${id}';render()">${name}</button>`).join('')}</div>`:''}<div class="grid two"><section><div class="section-head"><h2>Next actions</h2><span class="pill">${tasks.length} open</span></div>${tasks.length?tasks.map(t=>`<div class="taskcard" data-task-id="${esc(t.id)}" data-workflow-key="${esc(t.workflowKey)}"><span class="iconbox">${icon(t.role==='technician'?'jobs':t.appointment?'appointments':t.step==='contact'?'customers':'tasks')}</span><div class="info"><div class="btnrow" style="gap:6px;margin-bottom:4px"><h3>${esc(t.title)}</h3>${pill('Automatic','blue')}</div><p>${esc(t.detail||'')}</p><p style="margin-top:7px">${pill(t.role==='technician'?'Technician':t.role==='manager'?'Management':'Service advisor')} <span class="secondarytext">${esc(staff(t.who).name)} · ${esc(t.due||'Now')} ${t.ro?' · '+esc(roBy(t.ro)?.num||''):''}</span></p></div><button class="btn small" aria-label="Open workflow task ${esc(t.title)}" onclick="openTask('${t.id}')">Open step →</button></div>`).join(''):'<div class="card empty"><h3>Nothing in your queue</h3><p>Completing the actual RO or appointment step will automatically hand work to the next person.</p></div>'}<details class="card card-pad" style="margin-top:14px"><summary><b>Completed workflow tasks</b> · ${history.length} recent</summary>${history.map(t=>`<div class="item"><span class="iconbox">✓</span><div class="item-main"><b>${esc(t.title)}</b><div class="secondarytext">${esc(t.completedAt||'Completed')} · ${esc(staff(t.who).name)}</div></div></div>`).join('')||'<p class="sub">No completed steps yet.</p>'}</details></section><div class="stack"><div class="card card-pad"><h2>Workflow creates the tasks</h2><p class="sub">Tasks only appear when there is a real next action. A task cannot be checked off independently.</p><div class="item"><span class="iconbox">1</span><div class="item-main"><b>RO checked in</b><div class="secondarytext">Assigned technician receives inspection task.</div></div></div><div class="item"><span class="iconbox">2</span><div class="item-main"><b>Inspection submitted</b><div class="secondarytext">Advisor receives pricing and estimate task.</div></div></div><div class="item"><span class="iconbox">3</span><div class="item-main"><b>Estimate sent / signed</b><div class="secondarytext">Advisor tracks approval. When signed, technician receives authorized repairs.</div></div></div><div class="item"><span class="iconbox">4</span><div class="item-main"><b>Repair finished</b><div class="secondarytext">Advisor receives invoice task, then payment and vehicle release tasks.</div></div></div><div class="item"><span class="iconbox">5</span><div class="item-main"><b>Appointment or missed contact</b><div class="secondarytext">Confirmation and follow-up tasks are generated by their status or contact outcome.</div></div></div></div><div class="notice">Only owners and managers can reassign people. The current open task follows the new assignment automatically. Tasks complete only when the real workflow action occurs.</div></div></div>`;
}
function appointments(){const y=ui.calendarYear,m=ui.calendarMonth,monthName=new Date(y,m,1).toLocaleString('en-US',{month:'long',year:'numeric'});const first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=count;d++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const aps=data.appointments.filter(a=>a.date===date&&(manager()||a.advisor===data.actor));cells+=`<div class="calday ${date===DAY?'today':''}"><div class="daynum">${d}</div>${aps.map(a=>`<div class="cal-event" onclick="openModal('appointment',{id:'${a.id}'})">${esc(a.time)} ${esc(customer(a.customer).name.split(' ')[0])}</div>`).join('')}</div>`}return `${pageHead('Appointments','Schedule, confirm and check customers in from one screen.',advisor()?'<button class="btn primary" onclick="openModal(\'appointment\')">+ New appointment</button>':'')}<div class="card card-pad"><div class="section-head"><h2>${monthName}</h2><div class="btnrow"><button class="btn small" onclick="shiftMonth(-1)">←</button><button class="btn small" onclick="ui.calendarMonth=10;ui.calendarYear=2026;render()">This month</button><button class="btn small" onclick="shiftMonth(1)">→</button></div></div><div class="calgrid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="daylabels">${d}</div>`).join('')}${cells}</div></div><div class="card card-pad" style="margin-top:16px"><div class="section-head"><h2>Upcoming appointments</h2><span class="pill">${data.appointments.length} total</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Date / time</th><th>Customer / vehicle</th><th>Reason</th><th>Advisor</th><th>Status</th><th></th></tr></thead><tbody>${data.appointments.filter(a=>manager()||a.advisor===data.actor).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(a=>`<tr onclick="openModal('appointment',{id:'${a.id}'})"><td><b>${esc(a.date)}</b><div class="secondarytext">${esc(a.time)}</div></td><td><b>${esc(customer(a.customer).name)}</b><div class="secondarytext">${esc(car(vehicle(a.vehicle)))}</div></td><td>${esc(a.purpose)}</td><td>${esc(staff(a.advisor).name)}</td><td>${pill(a.status,a.status==='Arrived'?'green':'blue')}</td><td><span class="linkish">Open →</span></td></tr>`).join('')}</tbody></table></div></div>`}function shiftMonth(n){const date=new Date(ui.calendarYear,ui.calendarMonth+n,1);ui.calendarYear=date.getFullYear();ui.calendarMonth=date.getMonth();render()}
function reports(){if(isTech())return '<div class="notice">Financial reports are not available to technician accounts.</div>';const rows=visibleRos(),revenue=rows.filter(r=>r.paid).reduce((a,r)=>a+subtotal(r),0),taxPaid=rows.filter(r=>r.paid).reduce((a,r)=>a+subtotal(r)*tax(),0),costs=rows.filter(r=>r.paid).reduce((a,r)=>a+approvedLines(r).reduce((n,l)=>n+Number(l.cost),0),0),out=rows.filter(r=>r.invoiceSent&&!r.paid).reduce((a,r)=>a+billTotal(r),0),max=450;return `${pageHead('Reports','A simple picture of sales, job costs, collection and operating performance.')}<div class="notice">Prototype figures are calculated from the loaded sample repair orders, not live accounting. Sales and tax are shown separately; only collected jobs contribute to realized profit below.</div><div class="grid stats" style="margin-top:16px">${stat('Collected (including tax)',money(revenue+taxPaid),'Paid invoices only')}${stat('Sales before tax',money(revenue),'On collected jobs')}${stat('Direct job costs',money(costs),'On collected jobs')}${stat('Gross profit',money(revenue-costs),'Sales before tax − direct job costs')}</div><div class="grid two"><section class="card card-pad"><div class="section-head"><h2>Revenue snapshot</h2><span class="pill">Demo month</span></div><div class="bargraph">${[115,240,165,320,275,405,Math.max(20,revenue)].map((v,i)=>`<div class="barcol"><span class="amount">${money(v)}</span><div class="bar" style="height:${Math.min(100,v/max*100)}%"></div><small>${['May','Jun','Jul','Aug','Sep','Oct','Nov'][i]}</small></div>`).join('')}</div><p class="sub" style="margin-top:12px">May–Oct bars are illustrative. November reflects the current prototype’s paid invoices.</p></section><section class="card card-pad"><h2>Collections overview</h2><div class="metricrow"><span>Outstanding invoices</span><b>${money(out)}</b></div><div class="metricrow"><span>Sales tax collected</span><b>${money(taxPaid)}</b></div><div class="metricrow"><span>Active ROs</span><b>${rows.filter(r=>r.stage!=='closed').length}</b></div><div class="metricrow"><span>Awaiting authorization</span><b>${rows.filter(r=>r.stage==='approval').length}</b></div><div class="metricrow"><span>Completed ROs</span><b>${rows.filter(r=>r.stage==='closed').length}</b></div><p class="sub" style="margin-top:15px">Profit is attributed to collected work in this demo. A production version should also display cash-versus-accrual differences, expenses and refunds.</p></section></div><section class="card card-pad" style="margin-top:16px"><div class="section-head"><h2>Job profitability</h2><span class="pill">Cost transparency</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Repair order</th><th>Status</th><th>Sales before tax</th><th>Direct cost</th><th>Gross profit</th></tr></thead><tbody>${rows.filter(r=>r.lines.length).map(r=>{const cost=approvedLines(r).reduce((a,l)=>a+Number(l.cost),0);return `<tr onclick="openRo('${r.id}')"><td><b>${esc(r.num)}</b> <span class="secondarytext">${esc(car(vehicle(r.vehicle)))}</span></td><td>${stagePill(r)}</td><td>${money(subtotal(r))}</td><td>${money(cost)}</td><td><b>${money(subtotal(r)-cost)}</b></td></tr>`}).join('')}</tbody></table></div></section>`}
function settings(){const tabs=manager()?['team','business','roles','audit','prototype']:['business','roles','prototype'];if(!tabs.includes(ui.settingsTab))ui.settingsTab='business';return `${pageHead('Settings','Business profile, staff access, responsibilities and prototype controls.')}<div class="card card-pad"><div class="tabbar">${tabs.map(t=>`<button class="tab ${ui.settingsTab===t?'active':''}" onclick="ui.settingsTab='${t}';render()">${({team:'Team members',business:'Business profile',roles:'Role permissions',audit:'Activity log',prototype:'Demo controls'})[t]}</button>`).join('')}</div>${({team:settingsTeam,business:settingsBusiness,roles:settingsRoles,audit:settingsAudit,prototype:settingsPrototype})[ui.settingsTab]()} </div>`}
function settingsTeam(){return `<div class="section-head"><div><h2>Team members</h2><p class="sub">Only owners and managers can invite staff or assign access.</p></div><button class="btn primary" onclick="openModal('staff')">+ Add employee</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Role</th><th>Access</th><th>Status</th><th></th></tr></thead><tbody>${data.staff.map(s=>`<tr><td><div class="primarytext">${esc(s.name)} ${data.actor===s.id?'<span class="pill blue">Viewing as</span>':''}</div></td><td>${esc(({owner:'Owner',manager:'Manager',advisor:'Service advisor',technician:'Technician'})[s.role])}</td><td>${esc(s.role==='owner'?'All capabilities':s.role==='manager'?'Management + all work':s.role==='advisor'?'Assigned customers + office work':'Assigned technical work')}</td><td>${pill(s.active?'Active':'Inactive',s.active?'green':'red')}</td><td>${s.role==='owner'?'Protected':`<button class="btn small" onclick="openModal('editStaff',{id:'${s.id}'})">Manage</button>`}</td></tr>`).join('')}</tbody></table></div><div class="notice" style="margin-top:18px">This prototype lets you switch role to inspect visibility. Production must enforce the same boundaries server-side using tenant-scoped authorization and database policies.</div>`}

function settingsRoles(){return `<div class="section-head"><h2>Role access matrix</h2><span class="pill">Design specification</span></div><div class="table-wrap"><table class="data-table roles-table"><thead><tr><th>Capability</th><th>Owner</th><th>Manager</th><th>Advisor</th><th>Technician</th></tr></thead><tbody>${[['See all customers','✓','✓','—','—'],['See assigned customers','✓','✓','✓','Limited RO context'],['Manage users / roles','✓','✓','—','—'],['Reassign customers / ROs','✓','✓','—','—'],['Inspect assigned RO','✓','Supervise','—','✓'],['Create / send estimates','✓','✓','✓','—'],['Finish authorized repairs','✓','Supervise','—','✓'],['Invoice and collect payment','✓','✓','✓','—'],['Reports / billing settings','✓','✓','Limited reports','—'],['Access colleague tasks','✓','✓','—','—']].map(a=>`<tr>${a.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="notice" style="margin-top:16px">Managers may grant staff permissions within policy, but cannot demote the owner or escalate themselves to owner. Advisors never see another advisor’s assigned work.</div>`}
function settingsAudit(){return `<div class="section-head"><h2>Activity audit log</h2><span class="pill">${data.audit.length} events</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>When</th><th>Action</th><th>By</th></tr></thead><tbody>${data.audit.map(a=>`<tr><td>${esc(a.at)}</td><td>${esc(a.what)}</td><td>${esc(a.who)}</td></tr>`).join('')}</tbody></table></div>`}
function settingsPrototype(){return `<h2>Prototype controls</h2><p class="sub">Everything stays in this browser. Nothing here connects to Stripe, Supabase, Vercel or live customer data.</p><div class="stack" style="max-width:530px;margin-top:18px"><div class="callout"><h3>Test as a different employee</h3><p class="sub">Switch between owner, manager, advisor and technician to verify what they can see.</p><button class="btn" style="margin-top:12px" onclick="openModal('role')">Change current role</button></div><div class="callout"><h3>Start over with sample records</h3><p class="sub">Resets every edited customer, RO, payment and task to the original example data.</p><button class="btn danger" style="margin-top:12px" onclick="resetDemo()">Reset prototype data</button></div><div class="callout"><h3>Export prototype data</h3><p class="sub">Download your current sample records as JSON for review.</p><button class="btn" style="margin-top:12px" onclick="exportData()">Export JSON</button></div></div>`}
function optionsStaff(current='',roles=['advisor','technician','manager','owner']){return data.staff.filter(s=>s.active&&roles.includes(s.role)).map(s=>`<option value="${s.id}" ${current===s.id?'selected':''}>${esc(s.name)} (${esc(s.role)})</option>`).join('')};function optionsCustomer(current=''){return data.customers.filter(c=>manager()||canSeeCustomer(c)).map(c=>`<option value="${c.id}" ${current===c.id?'selected':''}>${esc(c.name)}</option>`).join('')};function optionsVehicle(cust,current=''){return data.vehicles.filter(v=>v.customer===cust).map(v=>`<option value="${v.id}" ${current===v.id?'selected':''}>${esc(car(v))}</option>`).join('')};function modalWrap(title,body,wide=false){return `<div class="modalshade" onclick="if(event.target===this)closeModal()"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="xbtn" aria-label="Close dialog" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div></div></div>`}

case 'customer':case 'editCustomer':{const c=m.id?customer(m.id):{};return modalWrap(m.id?'Edit customer':'Add customer',`<form onsubmit="event.preventDefault();saveCustomer(this,${m.id?`'${m.id}'`:'null'})" class="formgrid"><label class="span">Full name<input name="name" required value="${esc(c.name||'')}" placeholder="Customer name"></label><label>Mobile phone<input name="phone" required value="${esc(c.phone||'')}" placeholder="(210) 555-0100"></label><label>Email address<input name="email" type="email" required value="${esc(c.email||'')}" placeholder="customer@example.com"></label><label class="span">Address<input name="address" value="${esc(c.address||'')}"></label><label>Assigned service advisor<select name="advisor" ${manager()?'':'disabled'}>${optionsStaff(c.advisor||data.actor,['advisor','owner'])}</select></label><label class="span">Customer notes<textarea name="notes">${esc(c.notes||'')}</textarea></label><div class="span form-actions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">${m.id?'Save changes':'Create customer'}</button></div></form>`)}
case 'vehicle':return modalWrap('Add customer vehicle',`<form class="formgrid" onsubmit="event.preventDefault();saveVehicle(this)"><input type="hidden" name="customer" value="${esc(m.customerId||'')}"><label>Year<input name="year" type="number" min="1950" max="2030" required placeholder="2021"></label><label>Make<input name="make" required placeholder="Toyota"></label><label>Model<input name="model" required placeholder="Camry"></label><label>Mileage<input name="mileage" type="number" min="0" placeholder="45000"></label><label class="span">VIN (optional)<input name="vin" maxlength="17" placeholder="17-character VIN"></label><label>License plate<input name="plate" placeholder="TX-1234"></label><div class="span form-actions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Save vehicle</button></div></form>`);

// WORKFLOW-OWNED TASK ENGINE — actions are completed by the actual business event,
// never by a user ticking a checkbox. These are local prototype records only.
const TASK_ENGINE_VERSION=3;
function syncWorkflowTasks(){
  if(data.taskEngineVersion!==TASK_ENGINE_VERSION){
    // Retire old sample/manual tasks without touching customers or repair orders.
    data.tasks=(data.tasks||[]).filter(t=>t.source==='workflow'&&t.status==='done');
    data.followups=data.followups||[];
    data.taskEngineVersion=TASK_ENGINE_VERSION;
  }
  data.tasks=data.tasks||[];
  data.followups=data.followups||[];
  const desired=[];
  const assign=(key,title,role,who,detail,props={})=>{
    if(!who)return;
    desired.push({workflowKey:key,title,role,who,detail,due:'Now',source:'workflow',status:'open',...props});
  };
  const supervisor=()=>data.staff.find(x=>x.active&&x.role==='manager')?.id||'owner';
  for(const r of data.ros){
    const key=`ro:${r.id}:`;
    const details={ro:r.id,customer:r.customer,recordNumber:r.num};
    if(r.stage==='closed')continue;
    if(['intake','inspection','repair'].includes(r.stage)&&!r.tech){
      assign(key+'assign-tech','Assign a technician','manager',supervisor(),'Choose the technician responsible for this repair order.',{...details,step:'assign'});
      continue;
    }
    if(['estimate','approval','invoice','payment'].includes(r.stage)&&!r.advisor){
      assign(key+'assign-advisor','Assign a service advisor','manager',supervisor(),'Choose the advisor responsible for the next customer-facing step.',{...details,step:'assign'});
      continue;
    }
    switch(r.stage){
      case 'intake':
      case 'inspection':
        assign(key+'inspection','Inspect vehicle and submit findings','technician',r.tech,'Record inspection findings and submit them to the service advisor.',{...details,step:'inspection'});
        break;
      case 'estimate':
        assign(key+'estimate',r.lines.length?'Review and send estimate':'Price recommended repairs','advisor',r.advisor,r.lines.length?'Review the customer-facing estimate and send the packet.':'Build parts and labor from the technician inspection.',{...details,step:r.lines.length?'proposal':'estimate'});
        break;
      case 'approval':
        assign(key+'authorization','Track customer authorization','advisor',r.advisor,'Waiting for the customer to approve or decline every item and sign.',{...details,step:'proposal',due:'Awaiting customer'});
        break;
      case 'repair':
        assign(key+'repair','Complete authorized repairs','technician',r.tech,'Complete only customer-authorized repairs, then submit the job to the advisor.',{...details,step:'work'});
        break;
      case 'invoice':
        assign(key+'invoice','Send final customer invoice','advisor',r.advisor,'Review approved completed repairs and send the final invoice.',{...details,step:'invoice'});
        break;
      case 'payment':
        if(r.paid)assign(key+'release','Release vehicle and close RO','advisor',r.advisor,'Payment confirmed. Deliver receipt and release the vehicle.',{...details,step:'payment'});
        else assign(key+'payment','Confirm customer payment','advisor',r.advisor,'Invoice sent. Confirm receipt of payment and generate the receipt.',{...details,step:'payment',due:'Awaiting payment'});
        break;
    }
  }
  for(const ap of data.appointments){
    if(ap.status==='Canceled'||ap.checkedInRo)continue;
    const details={appointment:ap.id,customer:ap.customer,recordNumber:ap.date+' '+ap.time};
    if(ap.status==='Scheduled')assign(`appointment:${ap.id}:confirm`,'Confirm upcoming appointment','advisor',ap.advisor,'Contact customer to confirm '+ap.date+' at '+ap.time+'.',{...details,due:'Before appointment',step:'appointment'});
    if(ap.status==='Confirmed')assign(`appointment:${ap.id}:arrival`,'Check in scheduled appointment','advisor',ap.advisor,'Customer is confirmed for '+ap.date+' at '+ap.time+'. Update their arrival status.',{...details,due:ap.date+' '+ap.time,step:'appointment'});
    if(ap.status==='Arrived')assign(`appointment:${ap.id}:ro`,'Create RO for arrived customer','advisor',ap.advisor,'Open a repair order for this checked-in appointment.',{...details,due:'Now',step:'appointment-ro'});
  }
  for(const f of data.followups){
    if(f.resolved)continue;
    const c=customer(f.customer);
    assign(`contact:${f.customer}:followup`,'Follow up with '+c.name,'advisor',c.advisor,'The last contact needs a response: '+(f.reason||'Follow-up needed')+'. Log the next contact to resolve this task.',{customer:f.customer,step:'contact',due:'Next contact'});
  }
  const keys=new Set(desired.map(x=>x.workflowKey));
  for(const t of data.tasks){
    if(t.source==='workflow'&&t.status==='open'&&!keys.has(t.workflowKey)){
      t.status='done';t.completedAt=at();
      data.audit.unshift({at:at(),who:'Workflow',what:'Task finished by workflow: '+t.title});
    }
  }
  for(const next of desired){
    const old=data.tasks.find(t=>t.workflowKey===next.workflowKey&&t.source==='workflow'&&t.status==='open');
    if(old){Object.assign(old,next);continue;}
    // Re-entering a stage creates a new task; historical tasks remain preserved.
    data.tasks.push({id:uid('t'),createdAt:at(),...next});
    data.audit.unshift({at:at(),who:'Workflow',what:'Task assigned automatically: '+next.title+' → '+staff(next.who).name});
  }
}

    if(t.step==='assign'){openModal('assignRo',{id:r.id});return;}
    ui.page='jobs';ui.selectedCustomer=null;ui.selectedRo=r.id;
    ui.tab=t.step||'overview';render();window.scrollTo(0,0);return;
  }
  if(t.appointment){
    const a=data.appointments.find(x=>x.id===t.appointment);if(!a)return;
    if(t.step==='appointment-ro'){openModal('checkin',{customerId:a.customer,appointmentId:a.id});return;}

  }

  switch(doc){

    case 'inspection':return heading('Vehicle inspection report')+`<p class="cp-help">Inspection findings provided by the technician. Only reported checks are shown; this is not a comprehensive checklist.</p>${r.inspection.length?r.inspection.map(i=>`<div class="cp-inspection-item"><div class="row"><span class="label">${esc(i.name)}</span>${pill(i.result==='good'?'Satisfactory':'Needs attention',i.result==='good'?'green':'amber')}</div><p class="note">${esc(i.note||'No additional notes')}</p></div>`).join(''):'<p class="cp-empty-note">No inspection report has been attached yet.</p>'}<p class="cp-help" style="margin-top:18px">No inspection photos or other uploaded files are attached to this sample RO.</p>`;
    case 'terms':return heading('Customer authorization & terms')+`<p class="cp-help">Review the following demonstration acknowledgment before signing. These are example terms for testing, not configured legal terms for a real shop.</p><ol class="cp-term-list"><li>You make an independent approve or decline decision on <strong>each</strong> recommended service.</li><li>Only approved services may proceed. Declined services are retained on the repair order and excluded from the invoice.</li><li>The price summary is an estimate based on the currently listed parts, labor and displayed tax rate.</li><li>Additional work or revised pricing requires a separate request and new authorization before proceeding.</li><li>A final invoice is provided after authorized repairs are completed. Payment and receipt are separate steps.</li></ol><div class="cp-empty-note" style="margin-top:17px">Real privacy policies, warranties, agreements and uploaded attachments will appear here only when the business supplies them. Nothing is silently pre-approved.</div>`;
    case 'authorization':return r.authorized?heading('Signed work authorization')+`<div class="cp-proof"><h3>Customer decisions recorded</h3><p>Signed by <strong>${esc(r.signedBy||'Customer')}</strong> on ${esc(r.authorized)} for estimate version ${esc(r.estimateVersion||1)}.</p></div>${r.lines.map(l=>`<div class="cp-doc-row"><span>${esc(l.name)}</span>${pill(l.decision==='approved'?'Approved':'Declined',l.decision==='approved'?'green':'red')}</div>`).join('')}<div class="cp-breakdown-total major"><span>Authorized total (incl. estimated tax)</span><strong>${money(summary.total)}</strong></div>`:'<div class="cp-empty-note">This document will appear once you make every decision and submit your signature.</div>';
    case 'invoice':return r.invoiceSent?heading('Final invoice')+`<p class="cp-help">Invoice INV-${esc(r.num.replace('RO-',''))} · Sent ${esc(r.invoiceSent)}</p>${r.lines.filter(l=>l.decision==='approved').map(l=>`<div class="cp-doc-row"><span>${esc(l.name)}</span><strong>${money(Number(l.parts)+Number(l.labor))}</strong></div>`).join('')}<div class="cp-breakdown-total major"><span>Amount billed</span><strong>${money(billTotal(r))}</strong></div>`:'<div class="cp-empty-note">An invoice has not been issued yet. It will be available after repairs are completed.</div>';
    case 'receipt':return r.paid?heading('Payment receipt')+`<div class="cp-proof"><h3>Payment recorded</h3><p>${esc(r.paidAt||'')} · ${esc(r.paymentMethod||'Payment')}</p></div><div class="cp-breakdown-total"><span>Receipt</span><b>REC-${esc(r.num.replace('RO-',''))}</b></div><div class="cp-breakdown-total major"><span>Paid</span><strong>${money(r.amountPaid)}</strong></div>`:'<div class="cp-empty-note">A receipt will become available once payment is recorded.</div>';
  }
  return '<p class="cp-empty-note">Select a document to view it here.</p>';
}
function customerPortalScreen(r){
  const c=customer(r.customer),v=vehicle(r.vehicle),signed=!!r.authorized;
  const canRespond=r.stage==='approval'&&!!r.estimateSent&&!signed;
  const previewOnly=!r.estimateSent&&!signed;
  const sum=customerDecisionSummary(r),packet=packetDocs(r),doc=packet.find(x=>x.id===ui.customerDoc&&x.ready)?.id||'estimate';
  const progress=`${sum.decided} of ${r.lines.length} decisions`;
  const status=signed?'Signed and received':canRespond?'Your response is needed':previewOnly?'Draft — not sent':'View-only document copy';
  const badge=signed?'done':canRespond?'wait':'';
  return `<div class="cp-demo-bar"><span><strong>DESIGN PREVIEW</strong> &nbsp;Simulated customer link · no real email, payment or legal e-signature</span><button type="button" onclick="exitCustomerPreview()">← Return to shop prototype</button></div>
    <div class="cp-top"><div class="cp-top-inner"><div class="cp-brand"><div class="cp-brand-mark">S</div><div><div class="cp-brand-name">${esc(data.business)}</div><div class="cp-brand-sub">Your vehicle, your decisions.</div></div></div><div class="cp-helpline">Questions? Call us<b>${esc(data.settings.phone)}</b></div></div></div>
    <main class="cp-layout" id="customer-portal-content"><div class="cp-hero"><div class="cp-hero-top"><div><div class="cp-kicker">Vehicle service review</div><h1>${signed?'Your repair decisions are recorded':'Review your recommended repairs'}</h1><p>${signed?'Thank you. You can review your signed decisions and documents below.':'Select approve or decline for every repair, review the attached documents, then sign your choices.'}</p><div class="cp-hero-shortcuts"><button type="button" onclick="document.getElementById('cp-document-list').scrollIntoView({behavior:'smooth',block:'start'})">▤ View all documents</button><button type="button" onclick="document.getElementById('cp-sign-section').scrollIntoView({behavior:'smooth',block:'start'})">✓ Review signature</button></div></div><span class="cp-badge ${badge}">${signed?'✓ ':''}${esc(status)}</span></div><div class="cp-vehicle-row"><span>Customer<strong>${esc(c.name)}</strong></span><span>Vehicle<strong>${esc(car(v))}</strong></span><span>Repair order<strong>${esc(r.num)}</strong></span><span>Estimate<strong>Version ${esc(r.estimateVersion||1)}</strong></span></div></div>
    <div class="cp-columns"><div class="cp-stack"><section class="cp-card" aria-label="Repair decisions"><div class="cp-heading"><div><h2>1. Choose your repairs</h2><p class="cp-help">Each service has its own decision. You can decline optional work without declining everything.</p></div><span class="cp-progress">${esc(progress)}</span></div>
    ${r.lines.length?r.lines.map(l=>{const choice=signed?l.decision:(ui.approval[l.id]||'');return `<div class="cp-repair ${choice||''}" id="cp-repair-${esc(l.id)}"><div class="cp-repair-top"><div><h3>${esc(l.name)}</h3><p class="cp-breakdown">Parts ${money(l.parts)} · Labor ${money(l.labor)}</p></div><div class="cp-price">${money(Number(l.parts)+Number(l.labor))}</div></div>
    ${canRespond?`<div class="cp-decisions" role="group" aria-label="Decision for ${esc(l.name)}"><button type="button" class="cp-decision yes ${choice==='approved'?'active':''}" aria-pressed="${choice==='approved'}" onclick="setApproval('${esc(l.id)}','approved')">✓ Approve</button><button type="button" class="cp-decision no ${choice==='declined'?'active':''}" aria-pressed="${choice==='declined'}" onclick="setApproval('${esc(l.id)}','declined')">× Decline</button></div>`:`<div class="cp-result ${choice==='approved'?'yes':choice==='declined'?'no':''}">${choice==='approved'?'✓ Customer approved':choice==='declined'?'× Customer declined':previewOnly?'Preview only — send this packet before accepting decisions':'No decision recorded'}</div>`}</div>`}).join(''):'<div class="cp-empty-note">The shop has not yet added priced repairs to this estimate.</div>'}
    </section><section class="cp-card" aria-label="Your estimate total"><div class="cp-heading"><div><h2>2. Your selected total</h2><p class="cp-help">The amount updates as you approve or decline work.</p></div></div><div class="cp-breakdown-total"><span>All proposed work</span><b>${money(sum.proposed)}</b></div><div class="cp-breakdown-total"><span>Approved work</span><b>${money(sum.net)}</b></div><div class="cp-breakdown-total"><span>Declined work</span><b>${money(sum.declined.reduce((a,l)=>a+Number(l.parts)+Number(l.labor),0))}</b></div><div class="cp-breakdown-total"><span>Estimated tax (${esc(Number(data.settings.tax))}%) on approved work</span><b>${money(sum.taxAmount)}</b></div><div class="cp-breakdown-total major"><span>Estimated authorized amount</span><strong>${money(sum.total)}</strong></div><p class="cp-help">Only approved, completed services are invoiced. Any additional work requires new authorization.</p></section>
    <section class="cp-card" id="cp-sign-section" aria-label="Sign authorization"><div class="cp-heading"><div><h2>3. Sign your decisions</h2><p class="cp-help">Review the authorization terms in your document packet before submitting.</p></div></div>
    ${signed?`<div class="cp-proof" role="status"><h3>✓ Authorization submitted</h3><p>Signed by <b>${esc(r.signedBy||c.name)}</b><br>Recorded ${esc(r.authorized)}<br>${sum.approved.length} approved, ${sum.declined.length} declined.</p></div><p class="cp-help" style="margin-top:14px">${r.stage==='closed'?'The repair order is closed.':'The shop can now proceed with approved work. You will receive an invoice after service is completed.'}</p>`:canRespond?`<label class="cp-sign-input" for="customer-signature">Type your full name as your signature<input id="customer-signature" type="text" placeholder="Full name" maxlength="100" autocomplete="name" value="${esc(ui.signature)}" oninput="ui.signature=this.value;updateCustomerSubmitState()"></label><label class="cp-consent"><input id="customer-terms" type="checkbox" ${ui.customerAccepted?'checked':''} onchange="ui.customerAccepted=this.checked;updateCustomerSubmitState()"><span>I have reviewed the service estimate and authorization terms. I authorize <strong>only the work I selected Approve</strong>, and understand that declined items are not authorized.</span></label><p id="cp-submit-status" class="cp-help" role="status">${sum.decided===r.lines.length?'All repairs have a decision. Complete the signature and acknowledgment.':`${r.lines.length-sum.decided} repair decision(s) remaining.`}</p><button class="cp-submit" id="cp-submit" type="button" onclick="submitApproval('${esc(r.id)}')" disabled>Submit signed decisions</button><p class="cp-help" style="margin-top:12px">Simulation only. No legally binding electronic signature is created by this prototype.</p>`:`<div class="cp-empty-note">This is a read-only preview. The shop must send a finalized estimate before the customer can approve or decline work.</div>`}
    </section></div>
    <aside class="cp-stack"><section class="cp-card" id="cp-document-list" aria-label="Customer document packet"><div class="cp-heading"><div><h2>Documents in your packet</h2><p class="cp-help">Select any available document to view it here without leaving the page.</p></div><span class="cp-progress">${packet.filter(d=>d.ready).length} available</span></div><div class="cp-doc-link-list">${packet.map(d=>`<button type="button" class="cp-document-button ${doc===d.id?'selected':''}" onclick="chooseCustomerDoc('${d.id}')" aria-pressed="${doc===d.id}" ${d.ready?'':'disabled'}><span aria-hidden="true">${icon('tasks')}</span><span><span class="cp-doc-title">${esc(d.name)}</span><span class="cp-doc-sub">${esc(d.detail)}</span></span><span class="cp-doc-state">${d.ready?'View':'Not yet'}</span></button>`).join('')}</div><p class="cp-help" style="margin-top:14px">Other uploaded agreements, inspection photos and attachments would appear here if provided. None are attached to this sample.</p></section>
    <section class="cp-card" aria-label="Document preview"><div class="cp-heading"><div><h2>Document viewer</h2><p class="cp-help">Displaying the current ${esc(packet.find(x=>x.id===doc)?.name||'document').toLowerCase()}.</p></div><button class="btn small" type="button" onclick="window.print()">Print</button></div><div class="cp-doc-viewer" id="cp-document-viewer">${customerDocumentContents(r,doc)}</div></section>
    <section class="cp-card"><h2 style="font-size:17px">Need help?</h2><p class="cp-help">Contact your service advisor, ${esc(staff(r.advisor).name)}, at ${esc(data.settings.phone)} if you have questions about any recommendation. Ask the shop to send a revised estimate if the work changes.</p></section></aside></div></main><footer class="cp-footer">${esc(data.business)} · ${esc(data.settings.address)}<br>This is a clickable design prototype. There is no real public link, identity verification, electronic-signature provider, email delivery or payment processing.</footer>`;
}
function updateCustomerSubmitState(){
  const r=roBy(customerRoute());if(!r)return;
  const all=r.lines.length>0&&r.lines.every(l=>['approved','declined'].includes(ui.approval[l.id]));
  const name=(document.getElementById('customer-signature')?.value||ui.signature||'').trim();
  const consent=!!document.getElementById('customer-terms')?.checked;
  const btn=document.getElementById('cp-submit');if(btn)btn.disabled=!(all&&name.length>=3&&consent);
  const msg=document.getElementById('cp-submit-status');if(msg&&all)msg.textContent=name.length<3?'Enter your full name to sign.':!consent?'Review and accept the authorization terms.':'Ready to submit '+r.lines.length+' decisions.';
}

function render(){const customerId=customerRoute();if(customerId){const r=roBy(customerId);document.body.classList.add('customer-mode');$('#app').innerHTML=r?customerPortalScreen(r):'<main class="cp-layout"><h1>This customer review is unavailable</h1><p>Return to your shop prototype and open a valid RO.</p><button class="btn" onclick="exitCustomerPreview()">Return</button></main>';updateCustomerSubmitState();return;}document.body.classList.remove('customer-mode');if(!navAllowed(ui.page))ui.page='dashboard';const root=$('#app');root.innerHTML=`<div class="app">${sidebar()}<div class="main">${header()}<main id="content" class="content">${ui.notice?`<div id="global-notice" class="notice good" role="status" style="margin-bottom:18px">${esc(ui.notice)}</div>`:''}${content()}</main></div></div>${mobileNav()}${renderModal()}`}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal)closeModal()});window.addEventListener('hashchange',()=>render());window.addEventListener('storage',e=>{if(e.key===KEY){try{data=JSON.parse(e.newValue)||data;render()}catch{}}});save();render();
</script></body></html>
