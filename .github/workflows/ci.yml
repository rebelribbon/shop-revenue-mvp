name: CI

on:
  pull_request:
  push:
    branches:
      [
        main,
        m1-foundation,
        m2-customer-vehicle-memory,
        m3-job-costing,
        m4-invoices-payments,
        m7-money-finder,
        m8-recovered-revenue,
        m9-launch-hardening,
      ]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Same major version as the Supabase projects (17).
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      KEEP_TEST_DB: "true"
      TEST_DATABASE_NAME: m9_restore_source
      DATABASE_URL_BOOTSTRAP: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Temporary canonical formatting capture CRM
        run: |
          pnpm exec prettier --write "src/app/app/customers/page.tsx" "src/app/app/customers/[customerId]/page.tsx" "src/app/globals.css"
          node -e 'const fs=require("fs");for(const p of process.argv.slice(1)){const s=JSON.stringify(fs.readFileSync(p,"utf8"));for(let i=0;i<s.length;i+=2500)console.log("FORMATTED_FILE|"+p+"|"+Math.floor(i/2500)+"|"+s.slice(i,i+2500));}' "src/app/app/customers/page.tsx" "src/app/app/customers/[customerId]/page.tsx" "src/app/globals.css"

      - name: Generate per-run role passwords
        run: |
          for v in MIGRATION_OWNER APP_USER WORKER_USER ADMIN_USER; do
            pw=$(openssl rand -hex 24)
            echo "::add-mask::$pw"
            echo "${v}_PASSWORD=$pw" >> "$GITHUB_ENV"
          done

      - name: Role connection URLs
        shell: bash
        run: |
          {
            echo "DATABASE_URL_MIGRATION=postgresql://migration_owner:${MIGRATION_OWNER_PASSWORD}@localhost:5432/postgres"
            echo "DATABASE_URL_APP=postgresql://app_user:${APP_USER_PASSWORD}@localhost:5432/postgres"
            echo "DATABASE_URL_WORKER=postgresql://worker_user:${WORKER_USER_PASSWORD}@localhost:5432/postgres"
            echo "DATABASE_URL_ADMIN=postgresql://admin_user:${ADMIN_USER_PASSWORD}@localhost:5432/postgres"
          } >> "$GITHUB_ENV"

      - name: Bootstrap roles
        run: pnpm db:bootstrap

      - name: Apply the full migration chain to an empty database
        run: pnpm db:migrate

      - name: RLS presence check
        run: pnpm db:check-rls

      - name: RLS check rejects a tenant table added without RLS
        run: pnpm exec tsx scripts/ci/rls-check-selftest.ts

      - name: Secret scan
        run: pnpm security:secrets

      - name: Operational setup safety checks
        run: node --test tests/ci/*.test.mjs

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Lint (includes the raw database client import rule)
        run: pnpm lint

      - name: Source formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test suites (real Postgres, production roles, RLS and triggers)
        run: pnpm test

      - name: Restore the complete application schema and verify isolation
        env:
          PG_TOOLS_IMAGE: postgres:17
          SOURCE_ENV: ${{ runner.temp }}/m9-restore-source.env
          TARGET_ENV: ${{ runner.temp }}/m9-restore-target.env
          DRILL_RESULT_FILE: restore-drill-result.json
        run: |
          pnpm exec tsx scripts/ci/restore-env.ts
          pnpm backup:restore-drill
      - name: Save non-secret restore evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-restore-evidence
          path: restore-drill-result.json
          if-no-files-found: ignore
          retention-days: 30
