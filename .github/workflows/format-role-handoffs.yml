name: Format technician role handoff implementation
on:
  push:
    branches: [desktop-workspace-v1]
    paths: ['.github/workflows/format-role-handoffs.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/domain/job-handoffs.ts src/domain/assignments.ts src/domain/job-access.ts src/domain/inspections.ts src/domain/tasks.ts src/domain/estimates.ts src/lib/vehicle-inspection.ts src/lib/inspection-templates.ts src/app/desktop-demo/inspection-checklist.ts src/components/inspection-form.tsx src/components/workspace-navigation.tsx src/app/app/jobs/page.tsx src/app/app/tasks/page.tsx src/app/app/layout.tsx src/app/app/page.tsx src/server/actions/inspections.ts src/server/views/shop.ts src/app/app/customers/page.tsx src/app/app/schedule/page.tsx src/app/app/settings/page.tsx src/app/app/estimates/page.tsx src/app/app/invoices/page.tsx src/app/app/create/page.tsx tests/domain/inspections.test.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m "Format account-based technician RO handoffs"
            git push origin HEAD:desktop-workspace-v1
          fi
