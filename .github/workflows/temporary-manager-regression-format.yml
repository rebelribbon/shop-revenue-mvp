name: Temporary manager regression formatter
on:
  push:
    branches: [feat/manager-role-assigned-work]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/domain/documents.test.ts tests/domain/relay-handoffs.test.ts tests/domain/money-finder.test.ts tests/domain/revenue.test.ts tests/domain/ro-role-handoffs.test.ts tests/domain/m1-flows.test.ts tests/db/constraints.test.ts tests/domain/handoff-pings.test.ts
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          if ! git diff --cached --quiet; then
            git commit -m "Format updated access-control regression tests"
            git push origin HEAD:feat/manager-role-assigned-work
          fi
