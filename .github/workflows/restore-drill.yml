name: Restore drill

# M1 acceptance "one backup restored successfully into a scratch project" and
# Section 27 "one full restore drill documented with time to restore".
#
# Dumps current production (schemas app, graphile_worker, drizzle), restores it
# into a disposable Postgres container on this runner, verifies row counts,
# migration journal, RLS enabled + forced, policies, grants, app_user with no
# tenant context, and cross-tenant isolation, then tears everything down.
#
# Production read access: a temporary login role created through the Supabase
# Management API (existing SUPABASE_ACCESS_TOKEN secret) with BYPASSRLS +
# pg_read_all_data, a random masked password, VALID UNTIL 90 minutes, and
# dropped in an always() step. The pooler host and project ref come from the
# existing DATABASE_URL_MIGRATION secret. No new secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      PG_TOOLS_IMAGE: public.ecr.aws/supabase/postgres:17.11.0.004
      SCRATCH_PORT: "54329"
      DRILL_ROLE: drill_ro_${{ github.run_id }}
      DATABASE_URL_MIGRATION: ${{ secrets.DATABASE_URL_MIGRATION }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Require configuration
        run: |
          missing=""
          for v in DATABASE_URL_MIGRATION SUPABASE_ACCESS_TOKEN; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::BLOCKED: not configured:$missing"; exit 1; fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start disposable scratch Postgres (this runner only)
        run: |
          SCRATCH_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$SCRATCH_PASSWORD"
          echo "SCRATCH_PASSWORD=$SCRATCH_PASSWORD" >> "$GITHUB_ENV"
          export POSTGRES_PASSWORD="$SCRATCH_PASSWORD"
          docker run -d --name restore-scratch -e POSTGRES_PASSWORD -p "127.0.0.1:${SCRATCH_PORT}:5432" "$PG_TOOLS_IMAGE" >/dev/null
          ready=0
          for i in $(seq 1 90); do
            if PGPASSWORD="$SCRATCH_PASSWORD" docker exec -e PGPASSWORD restore-scratch \
                 psql -h 127.0.0.1 -U postgres -d postgres -tAc "select 1" >/dev/null 2>&1; then
              ready=$((ready + 1)); [ "$ready" -ge 3 ] && break
            else
              ready=0
            fi
            sleep 2
          done
          [ "$ready" -ge 3 ] || { docker logs --tail 50 restore-scratch; echo "::error::scratch Postgres did not become ready"; exit 1; }
          echo "Scratch Postgres ready on 127.0.0.1:${SCRATCH_PORT}"

      - name: Write scratch target env (masked, mode 600)
        run: |
          umask 077
          for v in MO APP WORKER ADMIN; do
            p=$(openssl rand -hex 24); echo "::add-mask::$p"; printf -v "PW_$v" '%s' "$p"
          done
          base="127.0.0.1:${SCRATCH_PORT}/postgres"
          {
            echo "DATABASE_URL_BOOTSTRAP=postgresql://postgres:${SCRATCH_PASSWORD}@${base}"
            echo "DATABASE_URL_MIGRATION=postgresql://migration_owner:${PW_MO}@${base}"
            echo "DATABASE_URL_APP=postgresql://app_user:${PW_APP}@${base}"
            echo "MIGRATION_OWNER_PASSWORD=${PW_MO}"
            echo "APP_USER_PASSWORD=${PW_APP}"
            echo "WORKER_USER_PASSWORD=${PW_WORKER}"
            echo "ADMIN_USER_PASSWORD=${PW_ADMIN}"
          } > "$RUNNER_TEMP/restore-target.env"

      - name: Create temporary read-only production login role
        run: |
          umask 077
          DRILL_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$DRILL_PASSWORD"
          export DRILL_PASSWORD
          node - <<'JS'
          const fs = require("node:fs");
          const u = new URL(process.env.DATABASE_URL_MIGRATION);
          const user = decodeURIComponent(u.username);
          const ref = user.includes(".") ? user.slice(user.indexOf(".") + 1) : "";
          if (!/^[a-z0-9]{20}$/.test(ref)) { console.error("::error::cannot derive project ref from DATABASE_URL_MIGRATION user"); process.exit(1); }
          if (!u.hostname.endsWith(".pooler.supabase.com")) { console.error("::error::DATABASE_URL_MIGRATION is not a Supabase pooler URL"); process.exit(1); }
          const role = process.env.DRILL_ROLE;
          if (!/^drill_ro_[0-9]+$/.test(role)) { console.error("::error::bad role name"); process.exit(1); }
          const until = new Date(Date.now() + 90 * 60 * 1000).toISOString();
          const pw = process.env.DRILL_PASSWORD;
          const sql = `
            CREATE ROLE ${role} LOGIN BYPASSRLS CONNECTION LIMIT 10 PASSWORD '${pw}' VALID UNTIL '${until}';
            DO $do$ BEGIN
              EXECUTE 'GRANT pg_read_all_data TO ${role}';
            EXCEPTION WHEN insufficient_privilege THEN
              EXECUTE 'GRANT migration_owner TO ${role}';
            END $do$;
            SELECT pg_has_role('${role}', 'pg_read_all_data', 'member') AS read_all_data,
                   pg_has_role('${role}', 'migration_owner', 'member') AS via_migration_owner;`;
          fs.writeFileSync(process.env.RUNNER_TEMP + "/create-role.json", JSON.stringify({ query: sql }));
          fs.writeFileSync(process.env.RUNNER_TEMP + "/project-ref", ref);
          // Session pooler (port 5432) on the same host; pg_dump needs session mode.
          const s = new URL(process.env.DATABASE_URL_MIGRATION);
          s.username = `${role}.${ref}`;
          s.password = pw;
          s.port = "5432";
          s.pathname = "/postgres";
          s.search = "";
          s.searchParams.set("sslmode", "require");
          s.searchParams.set("uselibpqcompat", "true");
          fs.writeFileSync(process.env.RUNNER_TEMP + "/restore-source.env", `DATABASE_URL_BOOTSTRAP=${s.toString()}\n`);
          JS
          ref=$(cat "$RUNNER_TEMP/project-ref")
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"
          code=$(curl -sS -o "$RUNNER_TEMP/create-role.out" -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$ref/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/create-role.json")
          rm -f "$RUNNER_TEMP/create-role.json"
          echo "Management API status: $code"
          echo "Role grants: $(cat "$RUNNER_TEMP/create-role.out")"
          case "$code" in 2*) ;; *) echo "::error::could not create the temporary role"; exit 1;; esac
          echo "DRILL_ROLE_CREATED=1" >> "$GITHUB_ENV"

      - name: Wait for pooler to accept the temporary role
        run: |
          node - <<'JS'
          const fs = require("node:fs");
          const { parseEnv } = require("node:util");
          const pg = require("pg");
          const url = parseEnv(fs.readFileSync(process.env.RUNNER_TEMP + "/restore-source.env", "utf8")).DATABASE_URL_BOOTSTRAP;
          (async () => {
            for (let i = 1; i <= 20; i++) {
              const c = new pg.Client({ connectionString: url });
              try { await c.connect(); await c.query("select 1"); await c.end(); console.log(`connected on attempt ${i}`); return; }
              catch (e) { console.log(`attempt ${i}: ${e.code || "error"}`); try { await c.end(); } catch {} }
              await new Promise((r) => setTimeout(r, 3000));
            }
            console.error("::error::temporary role never accepted by the pooler"); process.exit(1);
          })();
          JS

      - name: Restore drill (production -> disposable scratch)
        env:
          SOURCE_ENV: ${{ runner.temp }}/restore-source.env
          TARGET_ENV: ${{ runner.temp }}/restore-target.env
          DRILL_RESULT_FILE: restore-drill-result.json
        run: pnpm exec tsx scripts/backup/restore-drill.ts

      - name: Job summary
        if: always()
        run: |
          if [ -f restore-drill-result.json ]; then
            { echo '### Restore drill result'; echo '```json'; cat restore-drill-result.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No result file was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload non-secret result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-result
          path: restore-drill-result.json
          if-no-files-found: warn
          retention-days: 90

      - name: Drop temporary production role
        if: always() && env.DRILL_ROLE_CREATED == '1'
        run: |
          node -e '
            const role = process.env.DRILL_ROLE;
            const sql = `DO $do$ BEGIN
                PERFORM pg_terminate_backend(pid) FROM pg_stat_activity WHERE usename = $q$${role}$q$;
              EXCEPTION WHEN insufficient_privilege THEN NULL; END $do$;
              DROP ROLE IF EXISTS ${role};
              SELECT count(*) AS remaining FROM pg_roles WHERE rolname = $q$${role}$q$;`;
            require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/drop-role.json", JSON.stringify({ query: sql }));'
          code=$(curl -sS -o "$RUNNER_TEMP/drop-role.out" -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/drop-role.json")
          echo "Management API status: $code; $(cat "$RUNNER_TEMP/drop-role.out")"
          case "$code" in 2*) ;; *) echo "::error::temporary role was not dropped; it expires on its own within 90 minutes"; exit 1;; esac

      - name: Tear down scratch Postgres and env files
        if: always()
        run: |
          docker rm -f restore-scratch >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/restore-source.env" "$RUNNER_TEMP/restore-target.env"
          echo "Scratch database container removed."
