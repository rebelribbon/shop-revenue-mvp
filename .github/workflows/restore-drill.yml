name: Restore drill

# M1 acceptance "one backup restored successfully into a scratch project" and
# Section 27 "one full restore drill documented with time to restore".
#
# Dumps current production (schemas app, graphile_worker, drizzle), restores it
# into a disposable Postgres container on this runner, verifies row counts,
# migration journal, RLS enabled + forced, policies, grants, app_user with no
# tenant context, and cross-tenant isolation, then tears everything down.
#
# Production read access: BACKUP_DATABASE_URL (production environment secret,
# the Supabase session pooler string for the postgres role; the same secret the
# nightly off-site backup job uses). It is only written to a mode-600 file on
# the runner and passed to Docker by environment name, never printed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      PG_TOOLS_IMAGE: public.ecr.aws/supabase/postgres:17.11.0.004
      SCRATCH_PORT: "54329"
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
    steps:
      - name: Require configuration
        run: |
          missing=""
          if [ -z "$BACKUP_DATABASE_URL" ]; then
            echo "::error::BLOCKED: production environment secret BACKUP_DATABASE_URL is not set (Supabase > Connect > Session pooler string, user postgres)"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start disposable scratch Postgres (this runner only)
        run: |
          SCRATCH_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$SCRATCH_PASSWORD"
          echo "SCRATCH_PASSWORD=$SCRATCH_PASSWORD" >> "$GITHUB_ENV"
          export POSTGRES_PASSWORD="$SCRATCH_PASSWORD"
          mirror="docker.io/supabase/postgres:${PG_TOOLS_IMAGE##*:}"
          for i in 1 2 3 4; do
            if docker pull -q "$PG_TOOLS_IMAGE" >/dev/null 2>&1; then echo "pulled $PG_TOOLS_IMAGE"; break; fi
            if docker pull -q "$mirror" >/dev/null 2>&1; then docker tag "$mirror" "$PG_TOOLS_IMAGE"; echo "pulled $mirror (Docker Hub mirror, same tag)"; break; fi
            [ "$i" -lt 4 ] || { echo "::error::could not pull $PG_TOOLS_IMAGE or $mirror"; exit 1; }
            echo "pull attempt $i failed on both registries; retrying in $((i * 20))s"; sleep $((i * 20))
          done
          docker run -d --name restore-scratch -e POSTGRES_PASSWORD -p "127.0.0.1:${SCRATCH_PORT}:5432" "$PG_TOOLS_IMAGE" >/dev/null
          ready=0
          for i in $(seq 1 90); do
            if PGPASSWORD="$SCRATCH_PASSWORD" docker exec -e PGPASSWORD restore-scratch \
                 psql -h 127.0.0.1 -U postgres -d postgres -tAc "select 1" >/dev/null 2>&1; then
              ready=$((ready + 1)); [ "$ready" -ge 3 ] && break
            else
              ready=0
            fi
            sleep 2
          done
          [ "$ready" -ge 3 ] || { docker logs --tail 50 restore-scratch; echo "::error::scratch Postgres did not become ready"; exit 1; }
          echo "Scratch Postgres ready on 127.0.0.1:${SCRATCH_PORT}"

      - name: Write scratch target env (masked, mode 600)
        run: |
          umask 077
          for v in MO APP WORKER ADMIN; do
            p=$(openssl rand -hex 24); echo "::add-mask::$p"; printf -v "PW_$v" '%s' "$p"
          done
          base="127.0.0.1:${SCRATCH_PORT}/postgres"
          {
            echo "DATABASE_URL_BOOTSTRAP=postgresql://postgres:${SCRATCH_PASSWORD}@${base}"
            echo "DATABASE_URL_MIGRATION=postgresql://migration_owner:${PW_MO}@${base}"
            echo "DATABASE_URL_APP=postgresql://app_user:${PW_APP}@${base}"
            echo "MIGRATION_OWNER_PASSWORD=${PW_MO}"
            echo "APP_USER_PASSWORD=${PW_APP}"
            echo "WORKER_USER_PASSWORD=${PW_WORKER}"
            echo "ADMIN_USER_PASSWORD=${PW_ADMIN}"
          } > "$RUNNER_TEMP/restore-target.env"

      - name: Write production source env (masked, mode 600)
        run: |
          umask 077
          node - <<'JS'
          const fs = require("node:fs");
          let u;
          try { u = new URL(process.env.BACKUP_DATABASE_URL); } catch { console.error("::error::BACKUP_DATABASE_URL is not a valid URL"); process.exit(1); }
          const user = decodeURIComponent(u.username);
          if (!u.hostname.endsWith(".pooler.supabase.com")) { console.error("::error::BACKUP_DATABASE_URL must be the Supabase session pooler string (host ends in .pooler.supabase.com)"); process.exit(1); }
          if (!/^postgres\.[a-z0-9]{20}$/.test(user)) { console.error("::error::BACKUP_DATABASE_URL user must be postgres.<project-ref>"); process.exit(1); }
          if (!u.password) { console.error("::error::BACKUP_DATABASE_URL has no password"); process.exit(1); }
          u.port = "5432"; // session mode; pg_dump cannot use the transaction pooler
          u.pathname = "/postgres";
          u.search = "";
          u.searchParams.set("sslmode", "require");
          u.searchParams.set("uselibpqcompat", "true");
          fs.writeFileSync(process.env.RUNNER_TEMP + "/restore-source.env", `DATABASE_URL_BOOTSTRAP=${u.toString()}\n`);
          console.log(`source: ${u.hostname}:5432 as postgres.<ref>`);
          JS

      - name: Check production connectivity
        run: |
          node - <<'JS'
          const fs = require("node:fs");
          const { parseEnv } = require("node:util");
          const pg = require("pg");
          const url = parseEnv(fs.readFileSync(process.env.RUNNER_TEMP + "/restore-source.env", "utf8")).DATABASE_URL_BOOTSTRAP;
          (async () => {
            for (let i = 1; i <= 20; i++) {
              const c = new pg.Client({ connectionString: url });
              try { await c.connect(); await c.query("select 1"); await c.end(); console.log(`connected on attempt ${i}`); return; }
              catch (e) { console.log(`attempt ${i}: ${e.code || "error"}`); try { await c.end(); } catch {} }
              await new Promise((r) => setTimeout(r, 3000));
            }
            console.error("::error::could not connect to production with BACKUP_DATABASE_URL"); process.exit(1);
          })();
          JS

      - name: Restore drill (production -> disposable scratch)
        env:
          SOURCE_ENV: ${{ runner.temp }}/restore-source.env
          TARGET_ENV: ${{ runner.temp }}/restore-target.env
          DRILL_RESULT_FILE: restore-drill-result.json
        run: pnpm exec tsx scripts/backup/restore-drill.ts

      - name: Job summary
        if: always()
        run: |
          if [ -f restore-drill-result.json ]; then
            { echo '### Restore drill result'; echo '```json'; cat restore-drill-result.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No result file was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload non-secret result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-result
          path: restore-drill-result.json
          if-no-files-found: warn
          retention-days: 90

      - name: Tear down scratch Postgres and env files
        if: always()
        run: |
          docker rm -f restore-scratch >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/restore-source.env" "$RUNNER_TEMP/restore-target.env"
          echo "Scratch database container removed."
