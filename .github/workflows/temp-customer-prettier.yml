name: Temporary customer HTML formatting
on:
  push:
    branches: [fix/automotive-estimate-policy-preflight-review-20261123]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Show formatted diff
        run: |
          pnpm exec prettier --write src/components/estimate-signature.tsx
          git diff -- src/components/estimate-signature.tsx
