name: Provision Preview Owner

on:
  push:
    branches: [m2-customer-vehicle-memory]
    paths:
      - .github/workflows/provision-preview-owner.yml

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABASE_URL_MIGRATION: ${{ secrets.DATABASE_URL_MIGRATION }}
      PREVIEW_AUTH_SUBJECT: 029eb778-36e8-4757-8e0d-de84c80bfeed
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision dev preview owner
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const { Client } = pg;
          const db = new Client({ connectionString: process.env.DATABASE_URL_MIGRATION });
          await db.connect();
          try {
            await db.query('BEGIN');

            // migration_owner is intentionally read-only under FORCE RLS. These
            // policies exist only inside this transaction and are dropped before
            // commit, so the permanent security model is unchanged.
            await db.query(`DROP POLICY IF EXISTS preview_bootstrap_insert ON app."user"`);
            await db.query(`DROP POLICY IF EXISTS preview_bootstrap_insert ON app.business`);
            await db.query(`DROP POLICY IF EXISTS preview_bootstrap_insert ON app.location`);
            await db.query(`DROP POLICY IF EXISTS preview_bootstrap_insert ON app.membership`);
            await db.query(`CREATE POLICY preview_bootstrap_insert ON app."user" FOR INSERT TO migration_owner WITH CHECK (true)`);
            await db.query(`CREATE POLICY preview_bootstrap_insert ON app.business FOR INSERT TO migration_owner WITH CHECK (true)`);
            await db.query(`CREATE POLICY preview_bootstrap_insert ON app.location FOR INSERT TO migration_owner WITH CHECK (true)`);
            await db.query(`CREATE POLICY preview_bootstrap_insert ON app.membership FOR INSERT TO migration_owner WITH CHECK (true)`);

            const authSubject = process.env.PREVIEW_AUTH_SUBJECT;
            let userResult = await db.query(
              `SELECT id FROM app."user" WHERE auth_provider_id = $1::uuid LIMIT 1`,
              [authSubject],
            );
            let userId;
            if (userResult.rowCount) {
              userId = userResult.rows[0].id;
            } else {
              userResult = await db.query(
                `INSERT INTO app."user" (auth_provider_id, display_name, status)
                 VALUES ($1::uuid, 'Preview Owner', 'active') RETURNING id`,
                [authSubject],
              );
              userId = userResult.rows[0].id;
            }

            const existing = await db.query(
              `SELECT business_id FROM app.membership
               WHERE user_id = $1::uuid AND role = 'owner' AND status = 'active' LIMIT 1`,
              [userId],
            );

            if (!existing.rowCount) {
              const businessResult = await db.query(
                `INSERT INTO app.business (legal_name, dba, timezone, jurisdiction_code, status)
                 VALUES ('Preview Shop LLC', 'Preview Shop', 'America/Chicago', 'US-TX', 'active') RETURNING id`,
              );
              const businessId = businessResult.rows[0].id;
              await db.query(
                `INSERT INTO app.location (business_id, name, is_default, created_by_user_id)
                 VALUES ($1::uuid, 'Preview Shop', true, $2::uuid)`,
                [businessId, userId],
              );
              await db.query(
                `INSERT INTO app.membership (business_id, user_id, role, status, activated_at, created_by_user_id)
                 VALUES ($1::uuid, $2::uuid, 'owner', 'active', now(), $2::uuid)`,
                [businessId, userId],
              );
            }

            await db.query(`DROP POLICY preview_bootstrap_insert ON app.membership`);
            await db.query(`DROP POLICY preview_bootstrap_insert ON app.location`);
            await db.query(`DROP POLICY preview_bootstrap_insert ON app.business`);
            await db.query(`DROP POLICY preview_bootstrap_insert ON app."user"`);
            await db.query('COMMIT');

            const proof = await db.query(
              `SELECT count(*)::int AS n
               FROM app.membership m
               JOIN app."user" u ON u.id = m.user_id
               WHERE u.auth_provider_id = $1::uuid AND m.role = 'owner' AND m.status = 'active'`,
              [authSubject],
            );
            if (proof.rows[0]?.n !== 1) throw new Error('Preview owner membership proof failed');
            console.log('Preview owner provisioned: active owner membership verified.');
          } catch (error) {
            try { await db.query('ROLLBACK'); } catch {}
            throw error;
          } finally {
            await db.end();
          }
          NODE
