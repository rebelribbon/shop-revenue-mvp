name: M9 reference
on:
  push:
    branches: [m9-launch-hardening]
    paths: [.github/workflows/m9-spec-reference.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils > /dev/null
          pdftotext -layout docs/build-spec-v1.1.pdf /tmp/spec.txt
          grep -n -A50 -B8 -E 'M9|27\\. Launch|Launch checklist|Billing edge|subscription' /tmp/spec.txt | tail -280
