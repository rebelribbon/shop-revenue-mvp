name: M4 sandbox fixture

on:
  workflow_dispatch:
  push:
    branches: [m4-invoices-payments]
    paths:
      - scripts/dev/link-m4-sandbox.ts
      - .github/workflows/m4-sandbox.yml

permissions:
  contents: read

concurrency:
  group: m4-sandbox-fixture
  cancel-in-progress: false

jobs:
  link:
    if: github.ref == 'refs/heads/m4-invoices-payments'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      VERCEL_ORG_ID: team_ErajC90RgZfezuIaos4BoBjw
      VERCEL_PROJECT_ID: prj_c3KFd0Yr6iufwUAuvLRdu30GE68o
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Link the verified sandbox merchant through the runtime role
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          M4_SANDBOX_SETUP: 'true'
        run: |
          set -euo pipefail
          npx --yes vercel@63.1.0 pull --yes --environment=preview
          pnpm exec tsx --env-file=.vercel/.env.preview.local scripts/dev/link-m4-sandbox.ts
      - name: Clear pulled credentials
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.vercel').glob('.env*'):
              if path.is_file():
                  path.unlink()
          PY
