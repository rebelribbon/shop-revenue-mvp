name: Spec reference
on:
  workflow_dispatch:
  push:
    branches: [m7-money-finder]
    paths: [.github/workflows/spec-reference.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils > /dev/null
          pdftotext -layout docs/build-spec-v1.1.pdf spec.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('spec.txt').read_text().splitlines()
          selected=set()
          for i,line in enumerate(s):
              if any(w in line.lower() for w in ['m7','money finder','snooz','dormant','overdue service','opportunity detection']):
                  selected.update(range(max(0,i-8),min(len(s),i+65)))
          for i in sorted(selected): print(f'{i+1}: {s[i]}')
          PY
