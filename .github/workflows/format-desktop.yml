name: Format desktop branch
on:
  push:
    branches: [desktop-workspace-v1]
    paths:
      - '.github/workflows/format-desktop.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/app/app/jobs/page.tsx src/components/workspace-navigation.tsx
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/app/jobs/page.tsx src/components/workspace-navigation.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format desktop workspace implementation"
            git push origin HEAD:desktop-workspace-v1
          fi
