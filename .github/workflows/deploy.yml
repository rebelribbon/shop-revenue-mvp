name: Deploy

# Section 24 order: CI -> migrate staging -> deploy staging -> hosted smoke ->
# approve -> migrate production as migration_owner -> deploy app. Full M1 E2E
# stays in the local-stack workflow because those tests intentionally depend on
# seeded tenants, Mailpit and the local SMS inbox. Production migrations require
# a PITR restore point. GitHub environments "staging" and "production" hold the
# secrets; "production" requires reviewer approval.
# Two-project hosted model (revision 2026-10-23):
# - staging environment -> shop-revenue-dev
# - production environment -> shop-revenue-mvp-staging
# No separate hosted restore-scratch project is required; restore drills use
# isolated disposable local/ephemeral Postgres.
# The paid always-on Render worker is deferred for hosted M1 under
# docs/spec-revision-2026-10-23-defer-always-on-worker.md.
# BLOCKED until Vercel and the GitHub environments are configured; each job
# fails and names what is missing rather than passing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  staging:
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABASE_URL_MIGRATION: ${{ secrets.DATABASE_URL_MIGRATION }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      STAGING_BASE_URL: ${{ vars.APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Require configuration
        run: |
          missing=""
          for v in DATABASE_URL_MIGRATION VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID STAGING_BASE_URL; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::BLOCKED: staging not configured:$missing"; exit 1; fi
      - name: Migrate staging (migration_owner)
        run: pnpm db:migrate && pnpm db:check-rls
      - name: Deploy web (Vercel)
        run: |
          npx --yes vercel@63.1.0 pull --yes --environment=preview --token "$VERCEL_TOKEN"
          npx --yes vercel@63.1.0 build --token "$VERCEL_TOKEN"
          npx --yes vercel@63.1.0 deploy --prebuilt --token "$VERCEL_TOKEN" > deploy-url.txt
      - name: Hosted staging smoke
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$STAGING_BASE_URL/api/health" | jq -e '.status == "ok" and .database.ok == true' >/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then echo "::error::staging health check failed"; exit 1; fi
            sleep 10
          done
          curl -fsS -o /dev/null "$STAGING_BASE_URL/sign-in"
          curl -fsS -o /dev/null "$STAGING_BASE_URL/no-access"

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL_MIGRATION: ${{ secrets.DATABASE_URL_MIGRATION }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PRODUCTION_BASE_URL: ${{ vars.APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Require configuration
        run: |
          missing=""
          for v in DATABASE_URL_MIGRATION SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID PRODUCTION_BASE_URL; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::BLOCKED: production not configured:$missing"; exit 1; fi
      - name: Verify a PITR restore point exists
        run: |
          body=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/backups")
          echo "$body" | jq -e '.pitr_enabled == true and (.physical_backup_data.latest_physical_backup_unix_timestamp // 0) > 0' > /dev/null \
            || { echo "::error::No PITR restore point; refusing to migrate production"; exit 1; }
      - name: Migrate production (migration_owner; lock_timeout 5s, statement_timeout 60s)
        run: pnpm db:migrate && pnpm db:check-rls
      - name: Deploy web (Vercel)
        run: |
          npx --yes vercel@63.1.0 pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@63.1.0 build --prod --token "$VERCEL_TOKEN"
          npx --yes vercel@63.1.0 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
      - name: Production health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$PRODUCTION_BASE_URL/api/health" | jq -e '.status == "ok" and .database.ok == true' >/dev/null; then exit 0; fi
            sleep 10
          done
          echo "::error::production health check failed"; exit 1
